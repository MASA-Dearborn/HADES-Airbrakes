; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
lib_deps =
	adafruit/Adafruit Unified Sensor@^1.1.15
	adafruit/Adafruit BMP5xx Library@^1.0.2
	bolderflight/Bolder Flight Systems BMI088@^1.0.1
	adafruit/Adafruit LIS2MDL@^2.1.8
	greiman/SdFat@^2.3.1

; Hardware-in-the-loop build: sensors and actuator plant are simulated by
; the host (~/hades_airbrakes_control) over USB serial.
[env:teensy41-hil]
extends = env:teensy41
build_flags = -DHIL_MODE

; HIL with real actuator: sensors still virtual, but the real motor + Hall
; encoder are used so actual speed, friction and dead-band are in the loop.
[env:teensy41-hil-act]
extends = env:teensy41
build_flags = -DHIL_MODE -DHIL_REAL_ACTUATOR

; Actuator calibration tests — real motor + Hall encoder, no sensor hardware needed.
;   pio test -e test-actuator --filter calibrate_actuator
; Connect: H-bridge (IN1=36, IN2=37, Hall A=34, B=35.
[env:test-actuator]
extends = env:teensy41
build_src_filter = +<actuator.cpp>
test_framework = unity
